<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rana-logo-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rana Electronics" />
    <title>Rana Electronics — Installments</title>
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #0f172a; font-family: Arial, Helvetica, sans-serif;
      }
      #boot-splash img {
        width: 104px; height: 104px; object-fit: contain;
        border-radius: 50%;
        box-shadow: 0 10px 40px rgba(0,0,0,.45);
      }
      #boot-splash .bs-name { color: #e2e8f0; font-size: 19px; font-weight: 700; letter-spacing: .5px; }
      #boot-splash .bs-tag { color: #64748b; font-size: 12px; margin-top: -10px; }
      #boot-splash .bs-spin {
        width: 30px; height: 30px; border: 3px solid #1e293b; border-top-color: #38bdf8;
        border-radius: 50%; animation: bs-rot .8s linear infinite;
      }
      @keyframes bs-rot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Branded splash shown instantly while the app boots. React replaces
           #root on mount, so this disappears automatically. -->
      <div id="boot-splash">
        <img src="/rana-logo.png" alt="Rana Electronics" />
        <div class="bs-name">Rana Electronics</div>
        <div class="bs-tag">Electronics on easy installments</div>
        <div class="bs-spin"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
